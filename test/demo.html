<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <!-- Same referrer policy as HA's own index.html, so the map tiles are
       tested under the conditions they really load in. -->
  <meta name="referrer" content="same-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mercedes Trips Card — Demo</title>
  <style>
    /* Stand-ins for the HA theme variables the card reads. Dark by
       default; open with ?theme=light for the light theme, ?w=360 to
       squeeze the card to a phone-width column and ?lang=en (or any
       language tag) to switch the UI language. */
    body {
      --primary-color: #4c7bf4;
      --text-primary-color: #fff;
      --card-background-color: #262b3d;
      --secondary-background-color: #1d2130;
      --primary-text-color: #e8eaf0;
      --secondary-text-color: #9aa0b4;
      --divider-color: rgba(232, 234, 240, 0.12);
      --success-color: #43a047;
      --error-color: #e5534b;
      --primary-font-family: Roboto, -apple-system, "Segoe UI", sans-serif;
      margin: 0;
      padding: 20px;
      background: #1d2130;
      font-family: var(--primary-font-family);
      min-height: 100vh;
    }
    body.light {
      --primary-color: #03a9f4;
      --card-background-color: #fff;
      --secondary-background-color: #e5e5e5;
      --primary-text-color: #212121;
      --secondary-text-color: #727272;
      --divider-color: rgba(0, 0, 0, 0.12);
      background: #fafafa;
    }
    .container {
      max-width: 520px;
      margin: 0 auto;
    }
    h1 {
      color: var(--secondary-text-color);
      font-size: 1rem;
      margin-bottom: 16px;
    }
    mercedes-trips-card {
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Mercedes Trips — Local Demo</h1>
  </div>

  <script>
    const qs = new URLSearchParams(location.search);
    const DARK = qs.get("theme") !== "light";
    if (!DARK) document.body.classList.add("light");
    if (qs.get("w")) document.querySelector(".container").style.maxWidth = `${qs.get("w")}px`;

    // ── Mock data so the card has realistic trips without a real HA instance ──
    // Trips are generated relative to today so "Hoy", "Ayer" and the
    // default 7-day filter always have something to show. Addresses use
    // the same "road, [number,] suburb, town" shape the coordinator stores.
    // Public places in and around Madrid (squares, museums), not anyone's
    // home: the demo feeds the README screenshots and GIF.
    const PLACES = {
      centro:  { lat: 40.4183, lon: -3.6966, addr: "Calle de Alcalá, 42, Centro, Madrid" },
      prado:   { lat: 40.4138, lon: -3.6921, addr: "Paseo del Prado, Retiro, Madrid" },
      mercado: { lat: 40.4154, lon: -3.7090, addr: "Plaza de San Miguel, Sol, Madrid" },
      retiro:  { lat: 40.4199, lon: -3.6888, addr: "Plaza de la Independencia, 1, Retiro, Madrid" },
      alcala:  { lat: 40.4818, lon: -3.3644, addr: "Plaza de Cervantes, Alcalá de Henares" },
      toledo:  { lat: 39.8583, lon: -4.0226, addr: "Plaza de Zocodover, Toledo" },
      segovia: { lat: 40.9481, lon: -4.1184, addr: "Plaza del Azoguejo, Segovia" },
    };
    const PLAN = [
      // [days ago, start "HH:MM", minutes, from, to, km, kWh]
      [0, "07:35", 38, "centro", "alcala", 33, 5.6],
      [0, "08:39", 41, "alcala", "retiro", 34, 6.3],
      [0, "09:19", 9, "retiro", "mercado", 3, 0.6],
      [0, "09:57", 8, "mercado", "centro", 1.6, 0.4],
      [1, "19:40", 12, "centro", "mercado", 2.4, 0.6],
      [1, "22:34", 10, "mercado", "centro", 2.6, 0.6],
      [2, "08:05", 7, "centro", "prado", 1.4, 0.4],
      [2, "13:50", 9, "prado", "centro", 1.6, 0.4],
      [3, "10:10", 62, "centro", "toledo", 72.4, 12.9],
      [3, "18:30", 66, "toledo", "centro", 73.1, 13.8],
      [5, "08:02", 70, "centro", "segovia", 91.5, 17.2],
      [5, "17:15", 74, "segovia", "centro", 92.3, 17.9],
    ];
    const today = new Date();
    const at = (daysAgo, hhmm, plusMin = 0) => {
      const [h, m] = hhmm.split(":").map(Number);
      const d = new Date(today.getFullYear(), today.getMonth(), today.getDate() - daysAgo, h, m + plusMin);
      return d.toISOString();
    };
    const MOCK_TRIPS = PLAN.map(([ago, hhmm, mins, from, to, km, kwh], i) => {
      const a = PLACES[from], b = PLACES[to];
      const waypoints = Array.from({ length: 6 }, (_, k) => {
        const f = k / 5, bend = Math.sin(f * Math.PI) * 0.01 * (i % 2 ? 1 : -1);
        return [a.lat + (b.lat - a.lat) * f + bend, a.lon + (b.lon - a.lon) * f - bend, at(ago, hhmm, Math.round(mins * f))];
      });
      return {
        id: i + 1,
        start_time: at(ago, hhmm), end_time: at(ago, hhmm, mins),
        start_odometer: 27310 + i * 20, end_odometer: 27310 + i * 20 + Math.round(km),
        distance_km: km, soc_used: Math.round(kwh / 0.665), kwh_used: kwh,
        avg_kwh_per_100km: Math.round((kwh / km) * 1000) / 10,
        start_lat: a.lat, start_lon: a.lon, end_lat: b.lat, end_lon: b.lon,
        start_address: a.addr, end_address: b.addr,
        waypoints,
      };
    }).sort((x, y) => y.start_time.localeCompare(x.start_time));

    // Stand-in for hass.callApi(), which the card uses for its API calls.
    const mockCallApi = (method, path) => {
      const url = new URL(path, "http://demo/api/");
      const p = url.searchParams;
      if (url.pathname.endsWith("/mercedes_trips/trips")) {
        const s = p.get("start_date"), e = p.get("end_date");
        const hs = p.has("hour_start") ? Number(p.get("hour_start")) : 0;
        const he = p.has("hour_end") ? Number(p.get("hour_end")) : 23;
        const local = iso => { const d = new Date(iso); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
        const hour = iso => new Date(iso).getHours();
        const trips = MOCK_TRIPS.filter(t => (!s || local(t.start_time) >= s) && (!e || local(t.start_time) <= e)
          && hour(t.start_time) >= hs && hour(t.start_time) <= he);
        return new Promise(r => setTimeout(() => r({ trips, active_trip: null }), 250));
      }
      if (url.pathname.endsWith("/mercedes_trips/totals")) {
        return Promise.resolve({ trip_count: 9, distance_km: 268.4, kwh_used: 51.2 });
      }
      return Promise.reject(new Error(`demo: no mock for ${method} ${path}`));
    };
  </script>

  <!-- Load the card JS: a module, as HA loads it (it finds its vendor/
       files from its own URL). The inline module below runs after it. -->
  <script type="module" src="../custom_components/mercedes_trips/frontend/mercedes-trips-card.js"></script>

  <script type="module">
    // Simulate HA's exact initialization order:
    // 1) createElement (not yet in DOM)
    // 2) setConfig
    // 3) hass= (triggers _init → _buildDOM → scheduleMapInit while 0×0)
    // 4) append to DOM (triggers connectedCallback)
    const card = document.createElement("mercedes-trips-card");
    card.setConfig({});
    card.hass = {
      states: {},
      themes: { darkMode: DARK },
      locale: { language: qs.get("lang") || "es", time_format: "language" },
      config: { latitude: 40.4168, longitude: -3.7038 },
      callApi: mockCallApi,
    };
    document.querySelector(".container").appendChild(card);
  </script>
</body>
</html>
