name: CI

# Runs on every pull request and on main. "Python tests", "Card tests" and the HACS and hassfest validation are
# required checks: main only accepts changes through a pull request where they pass.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - run: pip install -r requirements_test.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Translations have the same keys
        run: python scripts/check_translations.py
      - name: Tests and fuzzing, with a coverage floor
        run: pytest

  card:
    name: Card tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Known vulnerabilities in what ships (Leaflet)
        run: npm audit --omit=dev --audit-level=moderate
      - name: The vendored Leaflet is npm's
        run: npm run check:vendor
      - name: Lint (ESLint's recommended rules; any warning fails)
        run: npm run lint
      - name: The card parses
        run: node --check custom_components/mercedes_trips/frontend/mercedes-trips-card.js
      - run: node_modules/.bin/playwright install --with-deps chromium
      - name: Browser tests (Playwright)
        run: npm test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
