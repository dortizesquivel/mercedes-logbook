name: Site

# Publishes the landing page (site/) to GitHub Pages, with the live demo of the card next to it (test/demo.html,
# served as demo/, and the card's own files, which it loads from ../custom_components/) and the README's images
# (docs/): https://dortizesquivel.github.io/mercedes-logbook/
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Assemble the site
        run: |
          mkdir -p _site/demo _site/docs _site/custom_components/mercedes_trips
          cp -r site/. _site/
          cp test/demo.html _site/demo/index.html
          # Only the card and its vendor/ files (Leaflet, the font): no Python, no database.
          cp -r custom_components/mercedes_trips/frontend _site/custom_components/mercedes_trips/
          cp docs/*.png docs/*.gif _site/docs/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write       # publish the site
      id-token: write    # prove the deployment comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
